<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 3500" font-family="Arial, sans-serif">
  <!-- 배경 -->
  <rect width="1200" height="3500" fill="#f8f9fa" />
  
  <!-- 제목 섹션 -->
  <rect x="50" y="30" width="1100" height="120" rx="10" fill="#4285f4" />
  <text x="600" y="100" font-size="48" font-weight="bold" text-anchor="middle" fill="white">QueryDSL 초보자 가이드</text>
  <text x="600" y="140" font-size="22" text-anchor="middle" fill="white">Java + Spring Boot + JPA + MySQL 환경에서 시작하기</text>

  <!-- 1. QueryDSL 정의 섹션 -->
  <rect x="50" y="180" width="1100" height="220" rx="10" fill="white" stroke="#ddd" stroke-width="2" />
  <text x="75" y="220" font-size="30" font-weight="bold" fill="#4285f4">1. QueryDSL이란?</text>
  
  <rect x="75" y="240" width="500" height="140" rx="5" fill="#e8f0fe" />
  <text x="90" y="270" font-size="18" fill="#202124">
    <tspan x="90" dy="0">• 타입 안전한 SQL 쿼리를 자바 코드로 작성할 수 있게 해주는 프레임워크</tspan>
    <tspan x="90" dy="30">• 컴파일 시점에 SQL 오류를 잡을 수 있음 (타입 안전성)</tspan>
    <tspan x="90" dy="30">• 자동완성 등 IDE 지원이 우수함</tspan>
    <tspan x="90" dy="30">• JPA, JDBC, MongoDB 등 다양한 데이터 소스 지원</tspan>
  </text>
  
  <rect x="600" y="240" width="525" height="140" rx="5" fill="#fce8e6" />
  <text x="615" y="270" font-size="18" fill="#202124">
    <tspan x="615" dy="0">SQL과 비교:</tspan>
    <tspan x="615" dy="30">• SQL: SELECT * FROM user WHERE name = '홍길동'</tspan>
    <tspan x="615" dy="30">• QueryDSL: queryFactory.selectFrom(user)</tspan>
    <tspan x="615" dy="30">                .where(user.name.eq("홍길동")).fetch()</tspan>
  </text>

  <!-- 2. 의존성 주입 섹션 -->
  <rect x="50" y="420" width="1100" height="330" rx="10" fill="white" stroke="#ddd" stroke-width="2" />
  <text x="75" y="460" font-size="30" font-weight="bold" fill="#4285f4">2. 의존성 주입 (Maven)</text>
  
  <rect x="75" y="480" width="1050" height="250" rx="5" fill="#263238" />
  <text x="90" y="510" font-size="16" fill="#8bc34a" font-family="monospace">
    <tspan x="90" dy="0">&lt;dependencies&gt;</tspan>
    <tspan x="90" dy="25">    &lt;!-- QueryDSL 의존성 --&gt;</tspan>
    <tspan x="90" dy="25">    &lt;dependency&gt;</tspan>
    <tspan x="90" dy="25">        &lt;groupId&gt;com.querydsl&lt;/groupId&gt;</tspan>
    <tspan x="90" dy="25">        &lt;artifactId&gt;querydsl-jpa&lt;/artifactId&gt;</tspan>
    <tspan x="90" dy="25">        &lt;version&gt;5.0.0&lt;/version&gt;</tspan>
    <tspan x="90" dy="25">    &lt;/dependency&gt;</tspan>
    <tspan x="90" dy="25">    &lt;dependency&gt;</tspan>
    <tspan x="90" dy="25">        &lt;groupId&gt;com.querydsl&lt;/groupId&gt;</tspan>
    <tspan x="90" dy="25">        &lt;artifactId&gt;querydsl-apt&lt;/artifactId&gt;</tspan>
    <tspan x="90" dy="25">        &lt;version&gt;5.0.0&lt;/version&gt;</tspan>
    <tspan x="90" dy="25">    &lt;/dependency&gt;</tspan>
    <tspan x="90" dy="25">&lt;/dependencies&gt;</tspan>
  </text>

  <!-- 3. 기본 설정 섹션 -->
  <rect x="50" y="770" width="1100" height="250" rx="10" fill="white" stroke="#ddd" stroke-width="2" />
  <text x="75" y="810" font-size="30" font-weight="bold" fill="#4285f4">3. 기본 설정 (JPAQueryFactory 설정)</text>
  
  <rect x="75" y="830" width="1050" height="170" rx="5" fill="#263238" />
  <text x="90" y="860" font-size="16" fill="#8bc34a" font-family="monospace">
    <tspan x="90" dy="0">@Configuration</tspan>
    <tspan x="90" dy="25">public class QuerydslConfig {</tspan>
    <tspan x="90" dy="25">    </tspan>
    <tspan x="90" dy="25">    @PersistenceContext</tspan>
    <tspan x="90" dy="25">    private EntityManager entityManager;</tspan>
    <tspan x="90" dy="25">    </tspan>
    <tspan x="90" dy="25">    @Bean</tspan>
    <tspan x="90" dy="25">    public JPAQueryFactory jpaQueryFactory() {</tspan>
    <tspan x="90" dy="25">        return new JPAQueryFactory(entityManager);</tspan>
    <tspan x="90" dy="25">    }</tspan>
    <tspan x="90" dy="25">}</tspan>
  </text>

  <!-- 4. 간단한 예제 5가지 섹션 -->
  <rect x="50" y="1040" width="1100" height="900" rx="10" fill="white" stroke="#ddd" stroke-width="2" />
  <text x="75" y="1080" font-size="30" font-weight="bold" fill="#4285f4">4. 간단한 예제 5가지</text>

  <!-- 예제 1: 단일 엔티티 조회 -->
  <rect x="75" y="1100" width="1050" height="150" rx="5" fill="#fef7e0" stroke="#fce8e6" stroke-width="1" />
  <text x="90" y="1125" font-size="20" font-weight="bold" fill="#e65100">예제 1: 단일 엔티티 조회</text>
  <rect x="90" y="1140" width="1020" height="90" rx="5" fill="#263238" />
  <text x="105" y="1165" font-size="16" fill="#8bc34a" font-family="monospace">
    <tspan x="105" dy="0">// 특정 ID로 사용자 조회</tspan>
    <tspan x="105" dy="25">User user = queryFactory</tspan>
    <tspan x="105" dy="25">    .selectFrom(QUser.user)</tspan>
    <tspan x="105" dy="25">    .where(QUser.user.id.eq(1L))</tspan>
    <tspan x="105" dy="25">    .fetchOne();</tspan>
  </text>

  <!-- 예제 2: 목록 조회 및 정렬 -->
  <rect x="75" y="1270" width="1050" height="150" rx="5" fill="#fef7e0" stroke="#fce8e6" stroke-width="1" />
  <text x="90" y="1295" font-size="20" font-weight="bold" fill="#e65100">예제 2: 목록 조회 및 정렬</text>
  <rect x="90" y="1310" width="1020" height="90" rx="5" fill="#263238" />
  <text x="105" y="1335" font-size="16" fill="#8bc34a" font-family="monospace">
    <tspan x="105" dy="0">// 활성 상태인 모든 사용자를 이름순으로 정렬하여 조회</tspan>
    <tspan x="105" dy="25">List&lt;User&gt; users = queryFactory</tspan>
    <tspan x="105" dy="25">    .selectFrom(QUser.user)</tspan>
    <tspan x="105" dy="25">    .where(QUser.user.active.eq(true))</tspan>
    <tspan x="105" dy="25">    .orderBy(QUser.user.name.asc())</tspan>
    <tspan x="105" dy="25">    .fetch();</tspan>
  </text>

  <!-- 예제 3: 페이징 처리 -->
  <rect x="75" y="1440" width="1050" height="150" rx="5" fill="#fef7e0" stroke="#fce8e6" stroke-width="1" />
  <text x="90" y="1465" font-size="20" font-weight="bold" fill="#e65100">예제 3: 페이징 처리</text>
  <rect x="90" y="1480" width="1020" height="90" rx="5" fill="#263238" />
  <text x="105" y="1505" font-size="16" fill="#8bc34a" font-family="monospace">
    <tspan x="105" dy="0">// 페이징 처리 (10개씩, 2번째 페이지)</tspan>
    <tspan x="105" dy="25">List&lt;User&gt; users = queryFactory</tspan>
    <tspan x="105" dy="25">    .selectFrom(QUser.user)</tspan>
    <tspan x="105" dy="25">    .orderBy(QUser.user.id.desc())</tspan>
    <tspan x="105" dy="25">    .offset(10)   // 첫 번째 페이지(10개) 건너뛰기</tspan>
    <tspan x="105" dy="25">    .limit(10)    // 10개만 가져오기</tspan>
    <tspan x="105" dy="25">    .fetch();</tspan>
  </text>

  <!-- 예제 4: 집계 함수 -->
  <rect x="75" y="1610" width="1050" height="150" rx="5" fill="#fef7e0" stroke="#fce8e6" stroke-width="1" />
  <text x="90" y="1635" font-size="20" font-weight="bold" fill="#e65100">예제 4: 집계 함수 사용</text>
  <rect x="90" y="1650" width="1020" height="90" rx="5" fill="#263238" />
  <text x="105" y="1675" font-size="16" fill="#8bc34a" font-family="monospace">
    <tspan x="105" dy="0">// 사용자의 평균 나이 계산</tspan>
    <tspan x="105" dy="25">Double avgAge = queryFactory</tspan>
    <tspan x="105" dy="25">    .select(QUser.user.age.avg())</tspan>
    <tspan x="105" dy="25">    .from(QUser.user)</tspan>
    <tspan x="105" dy="25">    .fetchOne();</tspan>
  </text>

  <!-- 예제 5: 프로젝션 (일부 컬럼만 선택) -->
  <rect x="75" y="1780" width="1050" height="150" rx="5" fill="#fef7e0" stroke="#fce8e6" stroke-width="1" />
  <text x="90" y="1805" font-size="20" font-weight="bold" fill="#e65100">예제 5: 프로젝션 (일부 컬럼만 선택)</text>
  <rect x="90" y="1820" width="1020" height="90" rx="5" fill="#263238" />
  <text x="105" y="1845" font-size="16" fill="#8bc34a" font-family="monospace">
    <tspan x="105" dy="0">// 사용자의 이름과 이메일만 조회</tspan>
    <tspan x="105" dy="25">List&lt;Tuple&gt; results = queryFactory</tspan>
    <tspan x="105" dy="25">    .select(QUser.user.name, QUser.user.email)</tspan>
    <tspan x="105" dy="25">    .from(QUser.user)</tspan>
    <tspan x="105" dy="25">    .fetch();</tspan>
    <tspan x="105" dy="25">// 결과 접근: results.get(0).get(QUser.user.name)</tspan>
  </text>

  <!-- 5. 조인 예제 3가지 섹션 -->
  <rect x="50" y="1960" width="1100" height="600" rx="10" fill="white" stroke="#ddd" stroke-width="2" />
  <text x="75" y="2000" font-size="30" font-weight="bold" fill="#4285f4">5. 조인 예제 3가지</text>

  <!-- 조인 예제 1: Inner Join -->
  <rect x="75" y="2020" width="1050" height="170" rx="5" fill="#e1f5fe" stroke="#b3e5fc" stroke-width="1" />
  <text x="90" y="2045" font-size="20" font-weight="bold" fill="#0277bd">예제 1: Inner Join (내부 조인)</text>
  <rect x="90" y="2060" width="1020" height="110" rx="5" fill="#263238" />
  <text x="105" y="2085" font-size="16" fill="#8bc34a" font-family="monospace">
    <tspan x="105" dy="0">// 사용자와 그들의 주문 목록 조회 (내부 조인)</tspan>
    <tspan x="105" dy="25">List&lt;Tuple&gt; result = queryFactory</tspan>
    <tspan x="105" dy="25">    .select(QUser.user, QOrder.order)</tspan>
    <tspan x="105" dy="25">    .from(QUser.user)</tspan>
    <tspan x="105" dy="25">    .join(QUser.user.orders, QOrder.order)   // user.orders와 QOrder 조인</tspan>
    <tspan x="105" dy="25">    .where(QOrder.order.amount.gt(10000))    // 10000원 초과 주문만 </tspan>
    <tspan x="105" dy="25">    .fetch();</tspan>
  </text>

  <!-- 조인 예제 2: Left Join -->
  <rect x="75" y="2210" width="1050" height="170" rx="5" fill="#e1f5fe" stroke="#b3e5fc" stroke-width="1" />
  <text x="90" y="2235" font-size="20" font-weight="bold" fill="#0277bd">예제 2: Left Join (왼쪽 조인)</text>
  <rect x="90" y="2250" width="1020" height="110" rx="5" fill="#263238" />
  <text x="105" y="2275" font-size="16" fill="#8bc34a" font-family="monospace">
    <tspan x="105" dy="0">// 모든 사용자와 주문 목록 조회 (주문이 없는 사용자도 포함)</tspan>
    <tspan x="105" dy="25">List&lt;Tuple&gt; result = queryFactory</tspan>
    <tspan x="105" dy="25">    .select(QUser.user, QOrder.order)</tspan>
    <tspan x="105" dy="25">    .from(QUser.user)</tspan>
    <tspan x="105" dy="25">    .leftJoin(QUser.user.orders, QOrder.order)  // 왼쪽 조인</tspan>
    <tspan x="105" dy="25">    .fetch();</tspan>
  </text>

  <!-- 조인 예제 3: Fetch Join -->
  <rect x="75" y="2400" width="1050" height="150" rx="5" fill="#e1f5fe" stroke="#b3e5fc" stroke-width="1" />
  <text x="90" y="2425" font-size="20" font-weight="bold" fill="#0277bd">예제 3: Fetch Join (페치 조인)</text>
  <rect x="90" y="2440" width="1020" height="90" rx="5" fill="#263238" />
  <text x="105" y="2465" font-size="16" fill="#8bc34a" font-family="monospace">
    <tspan x="105" dy="0">// 지연 로딩 방지를 위한 페치 조인</tspan>
    <tspan x="105" dy="25">List&lt;User&gt; users = queryFactory</tspan>
    <tspan x="105" dy="25">    .selectFrom(QUser.user)</tspan>
    <tspan x="105" dy="25">    .leftJoin(QUser.user.orders, QOrder.order).fetchJoin()  // 페치 조인</tspan>
    <tspan x="105" dy="25">    .distinct()  // 중복 제거</tspan>
    <tspan x="105" dy="25">    .fetch();</tspan>
  </text>

  <!-- 6. 다이나믹 쿼리 예제 2가지 섹션 -->
  <rect x="50" y="2580" width="1100" height="520" rx="10" fill="white" stroke="#ddd" stroke-width="2" />
  <text x="75" y="2620" font-size="30" font-weight="bold" fill="#4285f4">6. 다이나믹 쿼리 예제 2가지</text>

  <!-- 다이나믹 쿼리 예제 1: BooleanBuilder 사용 -->
  <rect x="75" y="2640" width="1050" height="200" rx="5" fill="#e8f5e9" stroke="#c8e6c9" stroke-width="1" />
  <text x="90" y="2665" font-size="20" font-weight="bold" fill="#2e7d32">예제 1: BooleanBuilder 사용</text>
  <rect x="90" y="2680" width="1020" height="140" rx="5" fill="#263238" />
  <text x="105" y="2705" font-size="16" fill="#8bc34a" font-family="monospace">
    <tspan x="105" dy="0">// 검색 조건에 따라 동적으로 쿼리 생성</tspan>
    <tspan x="105" dy="25">public List&lt;User&gt; searchUsers(String name, Integer age, Boolean active) {</tspan>
    <tspan x="105" dy="25">    BooleanBuilder builder = new BooleanBuilder();</tspan>
    <tspan x="105" dy="25">    </tspan>
    <tspan x="105" dy="25">    if (name != null) {</tspan>
    <tspan x="105" dy="25">        builder.and(QUser.user.name.contains(name));</tspan>
    <tspan x="105" dy="25">    }</tspan>
    <tspan x="105" dy="25">    if (age != null) {</tspan>
    <tspan x="105" dy="25">        builder.and(QUser.user.age.eq(age));</tspan>
    <tspan x="105" dy="25">    }</tspan>
    <tspan x="105" dy="25">    if (active != null) {</tspan>
    <tspan x="105" dy="25">        builder.and(QUser.user.active.eq(active));</tspan>
    <tspan x="105" dy="25">    }</tspan>
    <tspan x="105" dy="25">    </tspan>
    <tspan x="105" dy="25">    return queryFactory</tspan>
    <tspan x="105" dy="25">        .selectFrom(QUser.user)</tspan>
    <tspan x="105" dy="25">        .where(builder)</tspan>
    <tspan x="105" dy="25">        .fetch();</tspan>
    <tspan x="105" dy="25">}</tspan>
  </text>

  <!-- 다이나믹 쿼리 예제 2: Where 다중 파라미터 사용 -->
  <rect x="75" y="2860" width="1050" height="220" rx="5" fill="#e8f5e9" stroke="#c8e6c9" stroke-width="1" />
  <text x="90" y="2885" font-size="20" font-weight="bold" fill="#2e7d32">예제 2: Where 다중 파라미터 사용</text>
  <rect x="90" y="2900" width="1020" height="160" rx="5" fill="#263238" />
  <text x="105" y="2925" font-size="16" fill="#8bc34a" font-family="monospace">
    <tspan x="105" dy="0">// Where 절에 다중 파라미터 사용하여 동적 쿼리 생성</tspan>
    <tspan x="105" dy="25">public List&lt;User&gt; searchUsers(String name, Integer age, Boolean active) {</tspan>
    <tspan x="105" dy="25">    return queryFactory</tspan>
    <tspan x="105" dy="25">        .selectFrom(QUser.user)</tspan>
    <tspan x="105" dy="25">        .where(</tspan>
    <tspan x="105" dy="25">            nameContains(name),</tspan>
    <tspan x="105" dy="25">            ageEquals(age),</tspan>
    <tspan x="105" dy="25">            isActive(active)</tspan>
    <tspan x="105" dy="25">        )</tspan>
    <tspan x="105" dy="25">        .fetch();</tspan>
    <tspan x="105" dy="25">}</tspan>
    <tspan x="105" dy="25"></tspan>
    <tspan x="105" dy="25">// 각 조건을 메서드로 분리 (null이면 무시됨)</tspan>
    <tspan x="105" dy="25">private BooleanExpression nameContains(String name) {</tspan>
    <tspan x="105" dy="25">    return name != null ? QUser.user.name.contains(name) : null;</tspan>
    <tspan x="105" dy="25">}</tspan>
    <tspan x="105" dy="25">// ageEquals, isActive 메서드도 유사한 방식으로 구현</tspan>
  </text>

  <!-- 7. 총정리 섹션 -->
  <rect x="50" y="3120" width="1100" height="350" rx="10" fill="white" stroke="#ddd" stroke-width="2" />
  <text x="75" y="3160" font-size="30" font-weight="bold" fill="#4285f4">7. QueryDSL의 장점 총정리</text>
  
  <rect x="75" y="3190" width="500" height="250" rx="5" fill="#fff3e0" />
  <text x="90" y="3220" font-size="18" fill="#202124">
    <tspan x="90" dy="0">✓ 타입 안전한 쿼리 작성</tspan>
    <tspan x="90" dy="30">✓ 컴파일 시점 오류 검출</tspan>
    <tspan x="90" dy="30">✓ 자동 완성 기능 (IDE 지원)</tspan>
    <tspan x="90" dy="30">✓ 코드 재사용성 향상</tspan>
    <tspan x="90" dy="30">✓ 동적 쿼리 작성 용이</tspan>
    <tspan x="90" dy="30">✓ 복잡한 쿼리도 직관적인 코드로 표현</tspan>
    <tspan x="90" dy="30">✓ 유지보수성 향상</tspan>
  </text>
  
  <rect x="600" y="3190" width="525" height="250" rx="5" fill="#f3e5f5" />
  <text x="615" y="3220" font-size="18" fill="#202124">
    <tspan x="615" dy="0">다음 단계 학습 주제:</tspan>
    <tspan x="615" dy="30">• 페이징 처리와 정렬 최적화</tspan>
    <tspan x="615" dy="30">• 투영(Projection)과 DTO 매핑</tspan>
    <tspan x="615" dy="30">• 복잡한 서브쿼리 작성법</tspan>
    <tspan x="615" dy="30">• 벌크 연산(update, delete)</tspan>
    <tspan x="615" dy="30">• Native SQL과 혼합 사용</tspan>
    <tspan x="615" dy="30">• 성능 최적화 기법</tspan>
  </text>
</svg>
