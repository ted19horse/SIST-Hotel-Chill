jwt:
  secret: developmentOnlySecretKey # 개발용 JWT 키 (실제 운영에서는 반드시 변경)
  access-token:
    expiration: 86400000 # 24시간으로 연장 (개발 편의성)
  refresh-token:
    expiration: 604800000 # 7일

# CORS 설정 - 개발 환경에서는 모든 출처 허용
cors:
  allowed-origins: "*" # 모든 출처 허용
  allowed-methods: "*" # 모든 HTTP 메서드 허용
  allowed-headers: "*" # 모든 헤더 허용

# 보안 설정은 SecurityConfig에서 대부분 비활성화
